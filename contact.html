<h1>Contact me</h1>
<form id="contact-form" novalidate class="contact">
<div class="field"><label for="name">Name</label><input id="name" type="text"><span class="error"></span></div>
<div class="field"><label for="email">Email address</label><input id="email" type="text" inputmode="email"><span class="error"></span></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" type="text" inputmode="numeric"><span class="error"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" rows="5"></textarea><span class="error"></span></div>
<button class="btn" type="submit">Send message</button><p id="form-success" class="success" role="status"></p></form>
